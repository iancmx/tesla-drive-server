<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>TeslaDrive — YouTube for Tesla</title>
<!--
  TeslaDrive YouTube client.
  Playback architecture adapted from tesla-video-drive by madpowah (MIT)
  https://github.com/madpowah/tesla-video-drive

  There is deliberately NO video element on this page: Tesla pauses those
  at the OS level in Drive. Video is MPEG1-TS over WebSocket, decoded by
  JSMpeg (JS/WebGL) onto a canvas; audio is a separate MP3 stream in an
  audio element (not blocked in Drive).
  PASSENGER USE ONLY while the car is moving.
-->
<style>
:root{--bg:#0f0f0f;--surface:#212121;--chip:#272727;--chip-hover:#3d3d3d;--border:#303030;--text:#f1f1f1;--sub:#aaa;--red:#ff0033}
*{margin:0;padding:0;box-sizing:border-box}
html{scrollbar-color:#4d4d4d var(--bg)}
body{font-family:Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;min-height:100vh}
button{font-family:inherit;color:var(--text);background:none;border:none;cursor:pointer}
button:active{opacity:.65}

/* ---- header ---- */
header{position:sticky;top:0;z-index:50;background:var(--bg);display:flex;align-items:center;gap:18px;padding:10px 18px}
.logo{display:flex;align-items:center;gap:8px;flex:none;cursor:pointer;min-height:44px}
.logo .play{width:34px;height:24px;background:var(--red);border-radius:6px;position:relative;flex:none}
.logo .play::after{content:"";position:absolute;left:13px;top:6px;border-style:solid;border-width:6px 0 6px 10px;border-color:transparent transparent transparent #fff}
.logo .wordmark{font-size:20px;font-weight:700;letter-spacing:-.6px;white-space:nowrap}
.searchwrap{flex:1;display:flex;justify-content:center}
.searchpill{display:flex;width:100%;max-width:640px;height:46px;background:#121212;border:1px solid var(--border);border-radius:999px;overflow:hidden}
.searchpill input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--text);font-size:16px;padding:0 18px}
.searchpill input::placeholder{color:#888}
.searchpill button{width:74px;flex:none;background:#222;border-left:1px solid var(--border);display:flex;align-items:center;justify-content:center;min-height:44px}
.searchpill button svg{width:22px;height:22px;fill:var(--text)}
.headctl{display:flex;gap:8px;flex:none;align-items:center}
select{background:#121212;color:var(--text);border:1px solid var(--border);border-radius:8px;height:44px;padding:0 8px;font-size:14px}
.safety{text-align:center;color:#ffb020;font-size:12.5px;padding:5px 12px;border-bottom:1px solid #262626}

/* ---- chips ---- */
.chips{display:flex;gap:10px;padding:12px 18px 4px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--chip);border-radius:8px;padding:11px 16px;font-size:14px;font-weight:500;min-height:42px;white-space:nowrap}
.chip.active{background:#f1f1f1;color:#0f0f0f}

/* ---- home grid ---- */
main{padding:14px 18px 30px}
.statusline{color:var(--sub);font-size:13.5px;min-height:18px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:30px 16px}
.card{cursor:pointer}
.card:active{transform:scale(.985)}
.thumbwrap{position:relative;border-radius:12px;overflow:hidden;background:#1f1f1f;aspect-ratio:16/9}
.thumbwrap img{width:100%;height:100%;display:block;object-fit:cover}
.durbadge{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.85);color:#fff;font-size:12.5px;font-weight:500;padding:2px 5px;border-radius:4px}
.cardmeta{display:flex;gap:12px;margin-top:12px}
.avatar{width:36px;height:36px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;color:#fff}
.cardtext{min-width:0}
.cardtitle{font-size:15.5px;font-weight:500;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cardsub{color:var(--sub);font-size:13.5px;margin-top:3px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.state{grid-column:1/-1;text-align:center;color:var(--sub);font-size:15.5px;padding:46px 16px;line-height:1.5}
.state.err{color:#ff7b7b}
.skel .thumbwrap,.skel .skline{background:#1c1c1c;animation:pulse 1.3s ease-in-out infinite}
.skel .skline{height:14px;border-radius:4px;margin-top:12px}
.skel .skline.short{width:55%;margin-top:7px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* ---- watch view ---- */
#watchView{display:none;max-width:1180px;margin:0 auto}
#channelView{display:none;max-width:1180px;margin:0 auto}
.chanhead{display:flex;align-items:center;gap:14px;margin:4px 0 22px}
.chanhead .avatar{width:52px;height:52px;font-size:22px}
.chantitle{font-size:24px;font-weight:700;line-height:1.25}
.cardsub.link,.avatar.link{cursor:pointer}
.cardsub.link:hover{color:#fff;text-decoration:underline}
.watchchannel.link{cursor:pointer}
.watchchannel.link:hover{color:#fff;text-decoration:underline}
.backbtn{display:inline-flex;align-items:center;gap:8px;background:var(--chip);border-radius:999px;padding:11px 18px;font-size:15px;font-weight:500;min-height:44px;margin-bottom:14px}
.canvaswrap{background:#000;border-radius:12px;overflow:hidden;position:relative}
#nc{width:100%;display:block;background:#000}
#buffering{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);color:#fff;font-size:19px;font-weight:600;letter-spacing:.02em;z-index:3}
#buffering[hidden]{display:none}
.watchtitle{font-size:20px;font-weight:600;line-height:1.35;margin-top:14px}
.watchchannel{color:var(--sub);font-size:14.5px;margin-top:5px}
.seekrow{display:flex;align-items:center;gap:14px;margin-top:14px;background:var(--surface);border-radius:12px;padding:8px 14px}
.seekrow .time{min-width:58px;text-align:center;font-size:14px;font-variant-numeric:tabular-nums;color:var(--text)}
.seekrow input[type=range]{flex:1;min-width:120px;accent-color:var(--red);height:36px}
.seekrow input[type=range]:disabled{opacity:.35}
.watchctl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;background:var(--surface);border-radius:12px;padding:10px 14px}
.watchctl .btn{background:#3d3d3d;border-radius:999px;padding:11px 18px;font-size:14.5px;font-weight:500;min-height:44px}
.watchctl .btn-stop{background:#600}
.watchctl label{color:var(--sub);font-size:13.5px}
.watchctl input[type=range]{flex:1;min-width:110px;accent-color:var(--red);height:28px}
.watchctl select{height:44px}
.npstate{color:var(--sub);font-size:14px}
#npFps{color:#4caf50;font-weight:600;font-size:14px}
@media (max-width:640px){
  .logo .wordmark{display:none}
  header{gap:10px;padding:8px 12px}
  main{padding:12px 12px 26px}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
  <div class="logo" id="logoHome" title="TeslaDrive home">
    <div class="play"></div><div class="wordmark">TeslaDrive</div>
  </div>
  <div class="searchwrap">
    <div class="searchpill">
      <input id="q" type="text" placeholder="Search" autocomplete="off">
      <button id="btnSearch" aria-label="Search">
        <svg viewBox="0 0 24 24"><path d="M20.87 20.17l-5.59-5.59A8.5 8.5 0 1 0 14.28 15.28l5.59 5.59a.5.5 0 0 0 .7 0l.3-.3a.5.5 0 0 0 0-.7zM5 10.5a5.5 5.5 0 1 1 11 0 5.5 5.5 0 0 1-11 0z"/></svg>
      </button>
    </div>
  </div>
  <div class="headctl">
    <select id="region" aria-label="Region">
      <option value="US" selected>US</option><option value="CA">CA</option>
      <option value="GB">GB</option><option value="DE">DE</option>
      <option value="JP">JP</option><option value="AU">AU</option>
    </select>
    <select id="quality" aria-label="Quality">
      <option value="360">360p</option>
      <option value="480" selected>480p</option>
      <option value="720">720p</option>
      <option value="1080">1080p (heavy)</option>
    </select>
  </div>
</header>
<div class="safety">Passenger use only while the car is moving — the driver must never watch or operate this.</div>

<div id="homeView">
  <div class="chips" id="chips"></div>
  <main>
    <div class="statusline" id="statusLine"></div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<div id="watchView">
  <main>
    <button class="backbtn" id="btnBack">&#8592; Back</button>
    <div class="canvaswrap"><canvas id="nc" width="854" height="480"></canvas><div id="buffering" hidden>Buffering&hellip;</div></div>
    <div class="watchtitle" id="npTitle">—</div>
    <div class="watchchannel" id="npChannel"></div>
    <div class="seekrow">
      <span class="time" id="timeNow">0:00</span>
      <input type="range" id="seek" min="0" max="0" step="1" value="0" disabled aria-label="Seek">
      <span class="time" id="timeDur">0:00</span>
    </div>
    <div class="watchctl">
      <button class="btn btn-stop" id="npStop">Stop</button>
      <button class="btn" id="npResume" disabled>Resume</button>
      <button class="btn" id="btnBack10" disabled>&#8722;10s</button>
      <button class="btn" id="btnFwd10" disabled>+10s</button>
      <label for="vol">Sound</label>
      <input type="range" id="vol" min="0" max="100" value="100">
      <button class="btn" id="btnSync">Sync +2s</button>
      <select id="audioMode" aria-label="Audio mode">
        <option value="combined">Sync audio</option>
        <option value="separate" selected>Compat audio</option>
      </select>
      <select id="qualityWatch" aria-label="Quality">
        <option value="360">360p</option>
        <option value="480" selected>480p</option>
        <option value="720">720p</option>
        <option value="1080">1080p (heavy)</option>
      </select>
      <span class="npstate" id="npState">Idle</span>
      <span id="npFps">0 FPS</span>
    </div>
  </main>
</div>

<div id="channelView">
  <main>
    <button class="backbtn" id="btnChannelBack">&#8592; Back</button>
    <div class="chanhead">
      <div class="avatar" id="channelAvatar">?</div>
      <div class="chantitle" id="channelName">Channel</div>
    </div>
    <div class="grid" id="channelGrid"></div>
  </main>
</div>

<audio id="na" style="display:none"></audio>

<script src="jsmpeg.min.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var nc = $('nc'), na = $('na');
  var player = null, cur = null, curId = null, curChannelId = '', curChannelName = '';
  var fpsCount = 0, lastFps = 0, syncTimer = null, forceTimer = null;
  var homeScroll = 0, activeChip = 'All';
  var gridSeq = 0; // sequencing for home/channel fetches: newest request wins
  // Restart-seeking state: the MPEG1 stream itself has no timeline, so the
  // client tracks a virtual one — baseTimeSec is where the current stream
  // started in the source video, streamStartedAtMs is when its first frame
  // was decoded. Seeking = restart both pipes at a new baseTimeSec.
  var playSeq = 0, durationSec = null, isLiveStream = false;
  var baseTimeSec = 0, streamStartedAtMs = null, scrubbing = false, seekInFlight = false;
  var lastItem = null, lastPosSec = 0, lastWasLive = false; // remembered on Stop so Resume can restart there
  // Buffer management: the server encodes VOD faster than realtime, so the
  // client can bank a lead. We estimate the bank from bytes received on the
  // player's socket minus media decoded, gate the start on a pre-roll
  // target, and show a Buffering state instead of stuttering when it runs dry.
  var watchdogTimer = null, bytesReceived = 0, byteSocket = null, framesDecoded = 0;
  var audioBaseSec = 0, initialAligned = false, audioHeldForBuffer = false;
  var bufferHoldSince = 0, lastKeeperAt = 0;
  var syncOffsetSec = 0, forceStarted = false, streamGen = 0, stablePlaySince = 0;
  var lastByteSample = 0, lastByteSampleAt = 0, arrivalRate = 0, stallTimes = [];
  var lastCt = -1, lastAdvanceAt = 0, playStartedAt = 0, preRollDone = false;
  var bufferingNow = false, autoResumeAttempts = 0, streamEnded = false, failedStarts = 0;

  var CHIPS = ['All', 'Music', 'Gaming', 'News', 'Live', 'Technology', 'Cars', 'Comedy', 'Sports', 'Science', 'Travel'];
  var AVATAR_COLORS = ['#c62828', '#ad1457', '#6a1b9a', '#4527a0', '#283593', '#1565c0', '#00838f', '#2e7d32', '#f9a825', '#ef6c00', '#4e342e', '#546e7a'];

  function setStatus(t) { $('statusLine').textContent = t; }
  function fmtDur(s) {
    if (s == null) return '';
    s = Math.round(s); var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
    return (h ? h + ':' : '') + (h && m < 10 ? '0' : '') + m + ':' + (ss < 10 ? '0' : '') + ss;
  }
  function fmtViews(n) {
    if (n == null) return '';
    if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M views';
    if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K views';
    return n + ' views';
  }
  function avatarColor(name) {
    var h = 0; name = String(name || '?');
    for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
  }
  function thumb(id, img) {
    img.src = 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg';
    img.onerror = function () {
      if (img.src.indexOf('hqdefault') >= 0) img.src = 'https://i.ytimg.com/vi/' + id + '/mqdefault.jpg';
      else img.onerror = null;
    };
  }

  // ---- home grid ----
  function renderSkeletons(n, grid) {
    grid = grid || $('grid'); grid.innerHTML = '';
    for (var i = 0; i < n; i++) {
      var d = document.createElement('div'); d.className = 'card skel';
      var tw = document.createElement('div'); tw.className = 'thumbwrap';
      var l1 = document.createElement('div'); l1.className = 'skline';
      var l2 = document.createElement('div'); l2.className = 'skline short';
      d.appendChild(tw); d.appendChild(l1); d.appendChild(l2);
      grid.appendChild(d);
    }
  }
  function renderState(msg, isErr, grid) {
    grid = grid || $('grid'); grid.innerHTML = '';
    var d = document.createElement('div');
    d.className = 'state' + (isErr ? ' err' : '');
    d.textContent = msg;
    grid.appendChild(d);
  }
  function renderResults(items, label, grid) {
    var home = !grid;
    grid = grid || $('grid'); grid.innerHTML = '';
    if (!items || !items.length) {
      if (home) setStatus(label + ': no results');
      renderState('No videos found. Try a different search.', false, grid);
      return;
    }
    if (home) setStatus(label + ': ' + items.length + ' videos');
    items.forEach(function (it) {
      if (!/^[A-Za-z0-9_-]{11}$/.test(it.id)) return;
      var card = document.createElement('div'); card.className = 'card';
      var tw = document.createElement('div'); tw.className = 'thumbwrap';
      var img = document.createElement('img'); img.alt = ''; thumb(it.id, img);
      tw.appendChild(img);
      var dur = fmtDur(it.duration);
      if (dur) {
        var badge = document.createElement('span'); badge.className = 'durbadge';
        badge.textContent = dur; tw.appendChild(badge);
      }
      var meta = document.createElement('div'); meta.className = 'cardmeta';
      var av = document.createElement('div'); av.className = 'avatar';
      av.style.background = avatarColor(it.channel);
      av.textContent = (String(it.channel || '?').trim().charAt(0) || '?').toUpperCase();
      var tx = document.createElement('div'); tx.className = 'cardtext';
      var tt = document.createElement('div'); tt.className = 'cardtitle'; tt.textContent = it.title || 'Untitled';
      var s1 = document.createElement('div'); s1.className = 'cardsub'; s1.textContent = it.channel || '';
      if (it.channelId) {
        var goChannel = function (ev) { ev.stopPropagation(); openChannel(it.channelId, it.channel, false); };
        s1.className += ' link'; s1.title = 'More from ' + (it.channel || 'this channel');
        s1.onclick = goChannel;
        av.className += ' link'; av.onclick = goChannel;
      }
      tx.appendChild(tt); tx.appendChild(s1);
      var views = fmtViews(it.viewCount);
      if (views) {
        var s2 = document.createElement('div'); s2.className = 'cardsub'; s2.textContent = views;
        tx.appendChild(s2);
      }
      meta.appendChild(av); meta.appendChild(tx);
      card.appendChild(tw); card.appendChild(meta);
      card.onclick = function () { play(it); };
      grid.appendChild(card);
    });
  }

  function getJson(url, label) {
    var seq = ++gridSeq;
    setStatus(label + '...');
    renderSkeletons(8);
    fetch(url).then(function (r) { return r.json(); }).then(function (d) {
      if (seq !== gridSeq) return; // a newer request superseded this one
      if (!d.ok) {
        setStatus(label + ' failed');
        renderState(label + ' failed: ' + (d.error || 'error') +
          (d.detail ? ' — ' + String(d.detail).slice(0, 160) : '') +
          (d.attempts ? ' — ' + d.attempts.join('; ').slice(0, 200) : ''), true);
        return;
      }
      renderResults(d.results, label + (d.source ? ' (' + d.source + ')' : ''));
    }).catch(function (e) {
      if (seq !== gridSeq) return;
      setStatus(label + ' failed');
      renderState(label + ' failed: ' + e.message, true);
    });
  }
  function loadTrending() { getJson('/api/trending?region=' + encodeURIComponent($('region').value), 'Trending'); }
  function doSearch(qstr, label) {
    var q = String(qstr || '').trim();
    if (!q) { loadTrending(); return; }
    getJson('/api/search?q=' + encodeURIComponent(q), label || 'Search');
  }
  function setActiveChip(name) {
    activeChip = name;
    var btns = $('chips').querySelectorAll('.chip');
    for (var i = 0; i < btns.length; i++) {
      btns[i].className = 'chip' + (btns[i].textContent === name ? ' active' : '');
    }
  }
  (function buildChips() {
    var wrap = $('chips');
    CHIPS.forEach(function (name) {
      var b = document.createElement('button');
      b.className = 'chip' + (name === 'All' ? ' active' : '');
      b.textContent = name;
      b.onclick = function () {
        setActiveChip(name);
        if (name === 'All') loadTrending(); else doSearch(name, name);
      };
      wrap.appendChild(b);
    });
  })();

  // ---- watch view switching ----
  function showWatch() {
    if ($('homeView').style.display !== 'none') homeScroll = window.scrollY || 0;
    $('homeView').style.display = 'none';
    $('channelView').style.display = 'none';
    $('watchView').style.display = 'block';
    window.scrollTo(0, 0);
  }
  function showHome() {
    stopPlayback();
    $('watchView').style.display = 'none';
    $('channelView').style.display = 'none';
    $('homeView').style.display = 'block';
    var y = homeScroll;
    requestAnimationFrame(function () { window.scrollTo(0, y); });
  }

  // ---- channel view ----
  var channelReturn = 'home';
  function openChannel(channelId, channelName, fromWatch) {
    if (!channelId) return;
    channelReturn = fromWatch ? 'watch' : 'home';
    $('homeView').style.display = 'none';
    $('watchView').style.display = 'none';
    $('channelView').style.display = 'block';
    $('channelName').textContent = channelName || 'Channel';
    var av = $('channelAvatar');
    av.style.background = avatarColor(channelName);
    av.textContent = (String(channelName || '?').trim().charAt(0) || '?').toUpperCase();
    window.scrollTo(0, 0);
    loadChannel(channelId);
  }
  function loadChannel(channelId) {
    var seq = ++gridSeq;
    var grid = $('channelGrid');
    renderSkeletons(8, grid);
    fetch('/api/channel?id=' + encodeURIComponent(channelId)).then(function (r) { return r.json(); }).then(function (d) {
      if (seq !== gridSeq) return; // a newer request superseded this one
      if (!d.ok) {
        renderState('Could not load this channel: ' + (d.error || 'error') +
          (d.attempts ? ' — ' + d.attempts.join('; ').slice(0, 200) : ''), true, grid);
        return;
      }
      if (d.channel && d.channel.name) $('channelName').textContent = d.channel.name;
      renderResults(d.results, 'Channel', grid);
    }).catch(function (e) {
      if (seq !== gridSeq) return;
      renderState('Could not load this channel: ' + e.message, true, grid);
    });
  }
  $('btnChannelBack').onclick = function () {
    $('channelView').style.display = 'none';
    if (channelReturn === 'watch' && cur) {
      $('watchView').style.display = 'block';
    } else {
      showHome();
    }
  };

  // ---- virtual timeline / restart seeking ----
  function currentPosition() {
    if (!cur) return 0;
    var pos = baseTimeSec;
    // Prefer the media actually decoded: the wall clock keeps running
    // through decoder freezes and keeper holds, which used to make
    // Resume/seek jump past unseen media and misclassify late socket
    // drops as natural ends.
    if (player) pos += decodedSeconds();
    else if (streamStartedAtMs != null) pos += (performance.now() - streamStartedAtMs) / 1000;
    if (durationSec != null) pos = Math.min(pos, durationSec);
    return Math.max(0, pos);
  }
  function seekEnabled() {
    return !!(cur && durationSec != null && durationSec > 0 && !isLiveStream);
  }
  function updateSeekUI() {
    var seek = $('seek');
    var canSeek = seekEnabled() && !seekInFlight;
    seek.disabled = !canSeek;
    $('btnBack10').disabled = !canSeek;
    $('btnFwd10').disabled = !canSeek;
    seek.max = durationSec != null ? Math.floor(durationSec) : 0;
    $('timeDur').textContent = durationSec != null ? fmtDur(durationSec) : (isLiveStream ? 'Live' : '–:––');
    if (!scrubbing) {
      var pos = currentPosition();
      seek.value = Math.floor(pos);
      $('timeNow').textContent = fmtDur(pos);
    }
  }
  setInterval(updateSeekUI, 250);
  function seekTo(target) {
    if (!seekEnabled()) return;
    var t = Math.max(0, Math.min(Number(target) || 0, Math.max(0, durationSec - 0.3)));
    startPlayback(cur, t);
  }
  function seekBy(delta) { seekTo(currentPosition() + delta); }

  // ---- buffer management ----
  function setBufferingUI(show, label) {
    var el = $('buffering');
    if (label) el.textContent = label;
    el.hidden = !show;
  }
  function decodedSeconds() {
    if (player && typeof player.currentTime === 'number' && isFinite(player.currentTime) && player.currentTime > 0) return player.currentTime;
    return framesDecoded / 30;
  }
  function streamBytesPerSec() {
    var kbps = { '360': 700, '480': 1100, '720': 1800, '1080': 3500 }[$('quality').value] || 1100;
    if ($('audioMode').value === 'combined') kbps += 128;
    return kbps * 1000 / 8 * 1.06; // +MPEG-TS overhead
  }
  function bufferedSecondsEstimate() {
    if (!bytesReceived) return 0;
    return Math.max(0, bytesReceived / streamBytesPerSec() - decodedSeconds());
  }
  function attachByteCounter() {
    if (!player || !player.source || !player.source.socket) return;
    var sock = player.source.socket;
    if (byteSocket === sock) return;
    byteSocket = sock;
    try {
      sock.addEventListener('message', function (e) {
        if (e && e.data) bytesReceived += (e.data.byteLength || e.data.size || 0);
      });
    } catch (err) {}
  }
  function stopWatchdog() { if (watchdogTimer) { clearInterval(watchdogTimer); watchdogTimer = null; } }
  function startWatchdog(token) {
    stopWatchdog();
    lastCt = -1; lastAdvanceAt = performance.now(); playStartedAt = performance.now();
    preRollDone = false; bufferingNow = true; streamEnded = false;
    setBufferingUI(true, 'Buffering…');
    watchdogTimer = setInterval(function () {
      if (token !== playSeq || streamEnded) return;
      attachByteCounter();
      var now = performance.now();
      var ct = decodedSeconds();
      if (ct > lastCt + 0.05) { lastCt = ct; lastAdvanceAt = now; }
      var banked = bufferedSecondsEstimate();
      // Delivery rate in media-seconds per wall-second, sampled over
      // a ~2s window: ~1.0 is a healthy metered feed, materially below
      // that the picture MUST starve no matter what the client does.
      // Shown in the Buffering label so a starving stream says why.
      if (lastByteSampleAt && now > lastByteSampleAt) {
        var bpsNow = streamBytesPerSec();
        if (bpsNow) arrivalRate = ((bytesReceived - lastByteSample) / bpsNow) / ((now - lastByteSampleAt) / 1000);
        if (now - lastByteSampleAt >= 2000) { lastByteSample = bytesReceived; lastByteSampleAt = now; }
      } else { lastByteSample = bytesReceived; lastByteSampleAt = now; }
      if (bufferingNow) {
        setBufferingUI(true, arrivalRate ? 'Buffering… receiving ~' + arrivalRate.toFixed(1) + '× speed' : 'Buffering…');
      }
      if (!preRollDone) {
        // The server meters delivery at exactly realtime (its
        // produced-ahead queue is the buffer; this player consumes
        // media at arrival rate, so a client-side lead cannot exist).
        // Reveal once decoding is demonstrably running — ~1.5
        // media-seconds decoded — with a 15s no-trap fallback.
        if (player && bytesReceived === 0 && framesDecoded === 0 && now - playStartedAt > 20000) {
          setBufferingUI(true, 'No data from server — check: docker logs tesla-drive');
        }
        var anyData = bytesReceived > 0 || framesDecoded > 0;
        if (framesDecoded >= (isLiveStream ? 20 : 45) || (player && anyData && now - playStartedAt > 15000)) {
          preRollDone = true; bufferingNow = false; stablePlaySince = now;
          if (framesDecoded > 0) failedStarts = 0;
          setBufferingUI(false);
          if (!streamEnded) $('npState').textContent = 'Playing';
          if (!streamEnded && $('audioMode').value === 'separate' && audioHeldForBuffer) {
            audioHeldForBuffer = false;
            var rp = na.play(); if (rp && rp.catch) rp.catch(function () {});
          }
        }
        return;
      }
      if (seekInFlight && framesDecoded === 0 && now - playStartedAt > 20000) {
        seekInFlight = false; updateSeekUI(); // the seek stream never decoded; don't latch the controls
      }
      if (autoResumeAttempts > 0 && stablePlaySince && now - stablePlaySince > 60000) autoResumeAttempts = 0;
      // A wedged decoder never meets the exit conditions below (server
      // backpressure stops the bank growing too): restart outright after
      // ~12s without a single frame advance.
      if (bufferingNow && now - lastAdvanceAt > 20000 && banked < 2) {
        restartVideoAt($('audioMode').value === 'separate'
          ? audioBaseSec + (na.currentTime || 0) : currentPosition(), token);
        return;
      }
      // Only call it buffering when the bank is actually running dry AND
      // frames have stopped for a while. A brief decoder hiccup with
      // seconds of media still banked heals on its own — flashing the
      // overlay for it (the old 2.5s, bank-blind trigger) was just noise.
      if (!bufferingNow && now - lastAdvanceAt > 4000 && banked < 2) {
        // Repeated starvation means this quality is not sustaining on
        // this path (server CPU, network, or car decode): step down a
        // level instead of flapping the overlay forever.
        stallTimes.push(now);
        stallTimes = stallTimes.filter(function (t) { return now - t < 90000; });
        var qOrder = ['360', '480', '720', '1080'];
        var qi2 = qOrder.indexOf($('quality').value);
        if (stallTimes.length >= 3 && qi2 > 0 && !isLiveStream && cur) {
          var nq2 = qOrder[qi2 - 1], oq2 = qOrder[qi2];
          $('quality').value = nq2; $('qualityWatch').value = nq2;
          stallTimes = [];
          var itS = cur, posS = currentPosition();
          startPlayback(itS, posS);
          var tokS = playSeq; // the NEW stream's token, captured after the restart
          setTimeout(function () {
            if (tokS !== playSeq) return;
            $('npState').textContent = 'Dropped to ' + nq2 + 'p — ' + oq2 + 'p kept starving';
          }, 1600);
          return;
        }
        bufferingNow = true;
        setBufferingUI(true, 'Buffering…');
        $('npState').textContent = 'Buffering…';
        stablePlaySince = 0;
        // Compat mode: freeze the audio pipe with the video, or the audio
        // plays on through the stall and the two are out of sync forever.
        if ($('audioMode').value === 'separate' && player && na.currentTime > 0 && !na.ended) {
          try { na.pause(); } catch (e) {}
          audioHeldForBuffer = true; bufferHoldSince = now;
        }
      } else if (bufferingNow && now - lastAdvanceAt < 900) {
        var framesFlowing = now - lastAdvanceAt < 900;
        if (audioHeldForBuffer && !framesFlowing && now - bufferHoldSince > 4000) {
          restartVideoAt(audioBaseSec + (na.currentTime || 0), token);
          return;
        }
        bufferingNow = false; stablePlaySince = now;
        setBufferingUI(false);
        $('npState').textContent = 'Playing';
        if (audioHeldForBuffer) {
          audioHeldForBuffer = false;
          var pp = na.play(); if (pp && pp.catch) pp.catch(function () {});
        }
      }
    }, 500);
  }

  // ===== MPEG1 playback (canvas + JSMpeg, separate MP3 audio pipe) =====
  // Restart ONLY the video stream at a position (Compat-mode sync
  // corrections): the audio pipe keeps its place untouched.
  function restartVideoAt(pos, token) {
    if ($('audioMode').value === 'separate') {
      if (!na.paused) {
        try { na.pause(); } catch (e) {}
        // Restart from where the audio actually froze, not the caller's
        // slightly older measurement.
        pos = audioBaseSec + (na.currentTime || 0);
      }
      pos = Math.max(0, pos - syncOffsetSec); // keep any manual Sync offset
      audioHeldForBuffer = true; bufferHoldSince = performance.now();
    }
    if (player) { try { player.destroy(); } catch (e) {} player = null; }
    baseTimeSec = Math.max(0, pos);
    streamStartedAtMs = null; seekInFlight = false;
    framesDecoded = 0; bytesReceived = 0; byteSocket = null; streamEnded = false;
    preRollDone = false; bufferingNow = true; playStartedAt = performance.now();
    setBufferingUI(true, 'Buffering…');
    startVideo(token);
  }

  function startVideo(token) {
    var quality = $('quality').value;
    var useCombined = $('audioMode').value === 'combined';
    var wsUrl = (window.location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + window.location.host +
      '/ws/mpeg1?v=' + encodeURIComponent(curId) + '&quality=' + encodeURIComponent(quality) +
      '&t=' + encodeURIComponent(baseTimeSec) + '&mode=' + encodeURIComponent($('audioMode').value) +
      '&live=' + (isLiveStream ? '1' : '0');
    $('npState').textContent = baseTimeSec > 0 ? 'Seeking to ' + fmtDur(baseTimeSec) + '...' : 'Starting video...';
    fpsCount = 0; lastFps = 0; $('npFps').textContent = '0 FPS';
    framesDecoded = 0; bytesReceived = 0; byteSocket = null; streamEnded = false;
    // The watchdog's frame-advance tracker belongs to the OLD stream's
    // clock until reset: without this, a restart inherits a lastCt from
    // minutes into the previous video and stall detection goes blind.
    streamGen++; lastCt = -1; lastAdvanceAt = performance.now();
    lastByteSample = 0; lastByteSampleAt = 0; arrivalRate = 0;
    var pl = new JSMpeg.Player(wsUrl, {
      canvas: nc, audio: useCombined, streaming: true,
      // This JSMpeg build sizes its decoder buffers from these two options
      // (its old maxBufferSize option is ignored): 8 MB of video buffer is
      // what physically holds the banked buffer lead.
      videoBufferSize: 8 * 1024 * 1024, audioBufferSize: 1024 * 1024,
      pauseWhenHidden: false, preserveDrawingBuffer: true,
      onVideoDecode: function () {
        if (player !== pl || token !== playSeq) return;
        framesDecoded++;
        if (streamStartedAtMs == null) {
          streamStartedAtMs = performance.now();
          seekInFlight = false;
          updateSeekUI();
          // Compat startup alignment: the audio pipe started playing while
          // this video stream was still resolving/connecting, so it is
          // ahead by that pipeline latency. Restart the video once, right
          // at the audio's position, and the two start locked together.
          if (!initialAligned && $('audioMode').value === 'separate') {
            initialAligned = true;
            var ap = audioBaseSec + (na.currentTime || 0);
            if (!na.paused && ap > baseTimeSec + 0.75) {
              var t2 = token;
              setTimeout(function () { if (t2 === playSeq && cur) restartVideoAt(ap, t2); }, 50);
            }
          }
          // Combined mode: JSMpeg plays audio through WebAudio, which the
          // browser may start suspended — resume it inside playback.
          try {
            if (player.audio && player.audio.context && player.audio.context.resume) player.audio.context.resume();
            player.volume = $('vol').value / 100;
          } catch (e) {}
        }
        fpsCount++;
        var now = Date.now();
        if (now - lastFps >= 1000) {
          $('npFps').textContent = fpsCount + ' FPS';
          fpsCount = 0; lastFps = now;
          if (!bufferingNow) $('npState').textContent = 'Playing';
        }
      },
      onSourceEstablished: function () { if (token === playSeq && player === pl) { $('npState').textContent = 'Connected'; attachByteCounter(); } },
      onStalled: function () { /* the watchdog notices via currentTime */ },
      onSourceCompleted: function () {
        if (player !== pl || token !== playSeq) return;
        streamEnded = true;
        setBufferingUI(false);
        var failedStart = framesDecoded === 0;
        if (failedStart) failedStarts++; else failedStarts = 0;
        // A socket that closes well before the end of the video is a
        // dropped connection (proxy hiccup, network switch), not the end:
        // restart the stream at the current position automatically.
        var pos = currentPosition();
        var endedNaturally = durationSec != null && pos >= durationSec - 3;
        if (!endedNaturally && cur && autoResumeAttempts < 3) {
          autoResumeAttempts++;
          var it = cur, resumeAt = isLiveStream ? 0 : pos;
          if ($('audioMode').value === 'separate') {
            try { na.pause(); } catch (e) {}
            audioHeldForBuffer = true;
          }
          $('npState').textContent = failedStart ? 'Stream failed to start — retrying…' : 'Connection interrupted — resuming…';
          setBufferingUI(true, 'Reconnecting…');
          setTimeout(function () { if (token === playSeq) startPlayback(it, resumeAt, true); }, 1500);
          return;
        }
        if ($('audioMode').value === 'separate') { try { na.pause(); } catch (e) {} audioHeldForBuffer = false; }
        $('npState').textContent = failedStart
          ? 'Failed to start — check the server (docker logs tesla-drive)'
          : 'Ended';
        if (durationSec != null) { baseTimeSec = durationSec; streamStartedAtMs = null; }
        seekInFlight = false;
        lastItem = null; lastPosSec = 0;
        $('npResume').disabled = true;
        updateSeekUI();
      }
    });
    player = pl;
  }

  function teardownStreams() {
    try { na.playbackRate = 1; } catch (e) {}
    stopWatchdog();
    setBufferingUI(false);
    if (syncTimer) { clearInterval(syncTimer); syncTimer = null; }
    if (forceTimer) { clearTimeout(forceTimer); forceTimer = null; }
    if (player) { try { player.destroy(); } catch (e) {} player = null; }
    try { na.pause(); na.removeAttribute('src'); na.load(); } catch (e) {}
  }

  function startPlayback(it, startSec, autoResume) {
    var token = ++playSeq;
    teardownStreams();
    cur = it; curId = it.id;
    durationSec = (typeof it.duration === 'number' && it.duration > 0) ? it.duration : null;
    isLiveStream = !!(it.isLive || it.live);
    startWatchdog(token);
    baseTimeSec = Math.max(0, Number(startSec) || 0);
    if (durationSec != null) baseTimeSec = Math.min(baseTimeSec, Math.max(0, durationSec - 0.3));
    streamStartedAtMs = null;
    framesDecoded = 0; bytesReceived = 0; lastCt = -1; // no stale counters from a previous video
    seekInFlight = baseTimeSec > 0;
    audioBaseSec = baseTimeSec; initialAligned = false;
    audioHeldForBuffer = false; lastKeeperAt = 0;
    syncOffsetSec = 0; forceStarted = false; stablePlaySince = 0;
    if (!autoResume) { autoResumeAttempts = 0; stallTimes = []; }
    showWatch();
    var quality = $('quality').value;
    var dims = { '360': [640, 360], '480': [854, 480], '720': [1280, 720], '1080': [1920, 1080] }[quality] || [854, 480];
    if (nc.width !== dims[0] || nc.height !== dims[1]) { nc.width = dims[0]; nc.height = dims[1]; } // assigning canvas size clears it — skip when unchanged
    $('npTitle').textContent = it.title || it.id;
    curChannelId = it.channelId || ''; curChannelName = it.channel || '';
    var npCh = $('npChannel');
    npCh.textContent = it.channel || '';
    npCh.className = 'watchchannel' + (curChannelId ? ' link' : '');
    npCh.onclick = curChannelId ? function () { openChannel(curChannelId, curChannelName, true); } : null;
    $('npState').textContent = baseTimeSec > 0 ? 'Seeking to ' + fmtDur(baseTimeSec) + '...' : 'Buffering audio...';
    $('npResume').disabled = true;
    updateSeekUI();

    // If the grid item had no duration, fetch it so seeking can unlock.
    if (durationSec == null) {
      fetch('/api/info?v=' + encodeURIComponent(it.id)).then(function (r) { return r.json(); }).then(function (d) {
        if (token !== playSeq || !d || !d.ok) return;
        isLiveStream = !!d.isLive;
        if (d.channelId && !curChannelId) {
          curChannelId = d.channelId; curChannelName = d.channel || curChannelName;
          var npCh2 = $('npChannel');
          npCh2.className = 'watchchannel link';
          npCh2.onclick = function () { openChannel(curChannelId, curChannelName, true); };
        }
        if (!isLiveStream && typeof d.duration === 'number' && d.duration > 0) durationSec = d.duration;
        updateSeekUI();
      }).catch(function () {});
    }

    // Combined mode: audio is muxed into the video stream and decoded by
    // JSMpeg from the same timestamps — no second pipe, nothing to drift.
    // The Sync button only applies to the separate pipe, so disable it.
    var combined = $('audioMode').value === 'combined';
    $('btnSync').disabled = combined;
    if (combined) { startVideo(token); return; }

    // Separate (compat) mode: audio first (MP3 pipe, restarted at
    // baseTimeSec); video waits for it, like the original client.
    try { na.playbackRate = 1; } catch (e) {}
    na.preload = 'none';
    na.src = '/api/audio?v=' + encodeURIComponent(it.id) + '&t=' + encodeURIComponent(baseTimeSec) + '&_=' + Date.now();
    na.load();
    (function tp() {
      if (token !== playSeq || !curId) return;
      var p = na.play();
      if (p && p.catch) p.catch(function () { setTimeout(tp, 150); });
    })();

    // Launch the video stream as soon as audio is actually playing, then
    // keep the two pipes locked together. The old design aligned them
    // once at startup (plus a +4s audio nudge) and never corrected again,
    // so the video pipeline's startup latency — and every later stall —
    // became a permanent offset. The keeper below measures both
    // positions on one timeline and trims any drift it finds.
    syncTimer = setInterval(function () {
      if (token !== playSeq || !curId) return;
      if (!player) {
        if (!na.paused && na.readyState >= 2 && na.currentTime > 0) startVideo(token);
        return;
      }
      if (forceStarted && !streamEnded && !na.paused && na.currentTime > 0) {
        // The video was force-started silently and the audio has only
        // just arrived: restart the cheap audio pipe at the video's
        // position instead of letting the keeper throw the picture
        // back to ~0 to meet it.
        forceStarted = false; initialAligned = true;
        var vpos = baseTimeSec + decodedSeconds();
        audioBaseSec = vpos;
        na.src = '/api/audio?v=' + encodeURIComponent(curId) + '&t=' + encodeURIComponent(vpos) + '&_=' + Date.now();
        na.load();
        var fp = na.play(); if (fp && fp.catch) fp.catch(function () {});
        return;
      }
      if (streamEnded || bufferingNow || !preRollDone || streamStartedAtMs == null) return;
      if (na.paused) return;
      if (isLiveStream) return; // live has no fixed timeline to correct against
      var now = performance.now();
      var audioPos = audioBaseSec + (na.currentTime || 0);
      var drift = (audioPos - syncOffsetSec) - (baseTimeSec + decodedSeconds()); // >0: audio ahead of target
      // Gross desync (a long stall, a dropped pipe) needs a restart —
      // throttled so it can never spin.
      if (Math.abs(drift) > 2.5) {
        if (now - lastKeeperAt < 5000) return;
        lastKeeperAt = now;
        try { na.playbackRate = 1; } catch (e) {}
        restartVideoAt(audioPos, token);
        return;
      }
      // Everything smaller is a RATE error, not a position error: the
      // video's pace comes from its metered feed (accurate to ~1%) and
      // the audio element's pace is exact, so any residual skew shows
      // up as slowly growing drift. Discipline the audio's rate
      // continuously — a few percent either way, pitch-preserved — and
      // the two stay locked. The old bang-bang corrections (pause the
      // leading pipe for seconds at a time) are what the car showed as
      // the picture stopping and resuming while the audio ran on.
      var targetRate = 1;
      if (Math.abs(drift) > 0.12) {
        targetRate = 1 - Math.max(-0.08, Math.min(0.08, drift * 0.25));
      }
      if (Math.abs((na.playbackRate || 1) - targetRate) > 0.004) {
        try { na.preservesPitch = true; na.playbackRate = targetRate; } catch (e) {}
      }
    }, 250);

    // Timeout: force-start video after 10s even without audio.
    forceTimer = setTimeout(function () {
      if (token === playSeq && !player && curId) {
        $('npState').textContent = 'Forced start (no audio yet)...';
        forceStarted = true;
        startVideo(token);
      }
    }, 10000);
  }

  function play(it) { startPlayback(it, 0); }

  function stopPlayback() {
    // Remember where we were: with restart-based playback, "pause" can
    // only mean stop the pipes and restart them at the same position.
    if (cur) { lastItem = cur; lastPosSec = currentPosition(); lastWasLive = isLiveStream; }
    playSeq++;
    teardownStreams();
    cur = null; curId = null;
    durationSec = null; isLiveStream = false;
    baseTimeSec = 0; streamStartedAtMs = null; seekInFlight = false; scrubbing = false;
    $('npResume').disabled = !lastItem;
    $('npState').textContent = lastItem ? 'Stopped at ' + fmtDur(lastPosSec) + ' — tap Resume' : 'Stopped';
    updateSeekUI();
  }

  function resumePlayback() {
    if (!lastItem) return;
    var it = lastItem, pos = lastWasLive ? 0 : lastPosSec;
    lastItem = null; lastPosSec = 0;
    startPlayback(it, pos);
  }

  $('npStop').onclick = stopPlayback;
  $('npResume').onclick = resumePlayback;
  $('btnBack').onclick = showHome;
  $('logoHome').onclick = function () { if ($('watchView').style.display === 'block') showHome(); };
  $('btnSync').onclick = function () {
    // The keeper maintains this offset as its target; without that, it
    // treated the manual +2s as drift and silently undid it.
    syncOffsetSec = Math.min(10, syncOffsetSec + 2);
    try { na.currentTime = Math.min(na.currentTime + 2, na.duration || 999); } catch (e) {}
  };
  na.addEventListener('error', function () {
    if (cur && $('audioMode').value === 'separate') $('npState').textContent = 'Audio failed to load — check the server (docker logs tesla-drive)';
  });
  na.addEventListener('ended', function () {
    if (cur && !streamEnded && $('audioMode').value === 'separate' &&
        durationSec != null && currentPosition() < durationSec - 5) {
      $('npState').textContent = 'Audio ended early — it will not resync on its own';
    }
  });
  $('vol').oninput = function () {
    na.volume = this.value / 100;
    if (player && $('audioMode').value === 'combined') { try { player.volume = this.value / 100; } catch (e) {} }
  };
  $('audioMode').onchange = function () { if (cur) startPlayback(cur, currentPosition()); };
  // Tap on the picture also unlocks WebAudio in combined mode.
  nc.onclick = function () {
    try {
      if (player && player.audio && player.audio.context && player.audio.context.resume) player.audio.context.resume();
    } catch (e) {}
  };
  $('btnBack10').onclick = function () { seekBy(-10); };
  $('btnFwd10').onclick = function () { seekBy(10); };
  $('seek').oninput = function () {
    scrubbing = true;
    $('timeNow').textContent = fmtDur(Number(this.value) || 0);
    if (seekEnabled()) $('npState').textContent = 'Seek to ' + fmtDur(Number(this.value) || 0);
  };
  $('seek').onchange = function () {
    var target = Number(this.value) || 0;
    scrubbing = false;
    seekTo(target);
  };

  function syncQuality(fromEl, toEl) {
    toEl.value = fromEl.value;
    if (cur) startPlayback(cur, currentPosition());
  }
  $('quality').onchange = function () { syncQuality($('quality'), $('qualityWatch')); };
  $('qualityWatch').onchange = function () { syncQuality($('qualityWatch'), $('quality')); };

  $('btnSearch').onclick = function () { setActiveChip(''); doSearch($('q').value, 'Search'); };
  $('q').onkeydown = function (e) { if (e.key === 'Enter') $('btnSearch').click(); };
  $('region').onchange = function () { setActiveChip('All'); loadTrending(); };

  if (/QtCarBrowser|Tesla/i.test(navigator.userAgent)) setStatus('Tesla detected — loading trending...');
  loadTrending();
})();
</script>
</body>
</html>
